<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi Tiết Dự Án</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/detail.css" />
    <link rel="stylesheet" href="../css/validate.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="container-fluid">
          <a class="navbar-brand opacity" href="./projectManager.html"
            >Quản lý dự án</a
          >
          <div class="navbar-links">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link opacity" href="./projectManager.html"
                  >Dự án</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link opacity" href="./myTask.html"
                  >Nhiệm vụ của tôi</a
                >
              </li>
              <li class="nav-item">
                <button class="nav-link opacity" id="logoutBtn">
                  Đăng xuất
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <section class="container">
      <div class="content-container">
        <div class="circle circle-one"></div>
        <div class="main-content">
          <h1 class="opacity">CHI TIẾT DỰ ÁN</h1>
          <div class="project-info">
            <h3 class="opacity" id="projectName"></h3>
            <p id="projectDescription"></p>
            <div class="member-section">
              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <h4 class="opacity">Thành viên</h4>
                <button
                  class="action-btn opacity"
                  id="addMember"
                  data-bs-toggle="modal"
                  data-bs-target="#exampleModal"
                >
                  <span class="btn-icon">+</span> Thêm thành viên
                </button>
              </div>
              <div class="member-list" id="memberList"></div>
              <div class="menu-member">
                <span
                  class="menu-icon opacity"
                  id="menuMember"
                  data-bs-toggle="modal"
                  data-bs-target="#exampleModal"
                  >⋯</span
                >
              </div>
            </div>
          </div>

          <div class="task-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3 class="opacity">Danh Sách Nhiệm Vụ</h3>
              <div class="d-flex">
                <button class="action-btn opacity mr-2" id="addTask">
                  <span class="btn-icon">+</span> Thêm Nhiệm Vụ
                </button>
                <select class="form-select opacity mr-2" id="sortTasks">
                  <option value="" disabled selected>Sắp xếp theo</option>
                  <option value="dueDate-asc">Hạn chót: Sớm nhất trước</option>
                  <option value="dueDate-desc">
                    Hạn chót: Muộn nhất trước
                  </option>
                  <option value="priority-desc">
                    Độ ưu tiên: Cao đến Thấp
                  </option>
                  <option value="priority-asc">Độ ưu tiên: Thấp đến Cao</option>
                </select>
                <input
                  type="text"
                  placeholder="Tìm kiếm nhiệm vụ"
                  id="searchTask"
                  class="search-input"
                />
              </div>
            </div>
            <table class="project-table">
              <thead>
                <tr>
                  <th class="text-center">ID</th>
                  <th>Tên Nhiệm Vụ</th>
                  <th>Người Phụ Trách</th>
                  <th>Ưu Tiên</th>
                  <th>Ngày Bắt Đầu</th>
                  <th>Hạn Chót</th>
                  <th>Tiến Độ</th>
                  <th class="text-center">Hành Động</th>
                </tr>
              </thead>
              <tbody id="taskList"></tbody>
            </table>
            <nav aria-label="Page navigation">
              <ul class="pagination" id="pagination"></ul>
            </nav>
          </div>
        </div>
        <div class="circle circle-two"></div>
      </div>
      <div class="theme-btn-container"></div>
    </section>

    <footer>© 2025 Quản Lý Dự Án Nhóm. All rights reserved.</footer>

    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Quản lý thành viên
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row" id="modalHeader">
              <div class="col-12">
                <h5 class="text-center mb-4 opacity">Danh sách thành viên</h5>
              </div>
            </div>
            <div id="modalContent" class="modal-form">
              <div class="member-grid"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary modal-btn modal-btn-cancel"
              data-bs-dismiss="modal"
            >
              Đóng
            </button>
            <button
              type="button"
              class="btn btn-primary modal-btn modal-btn-save"
              id="btnSave"
            >
              Lưu
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/logout.js" type="module"></script>
    <script src="../js/detailProject.js" type="module"></script>
  </body>
</html>
