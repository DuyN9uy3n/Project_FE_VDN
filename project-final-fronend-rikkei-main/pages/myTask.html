<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Nhiệm Vụ</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/myTask.css" />
    <link rel="stylesheet" href="../css/validate.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="container-fluid">
          <a class="navbar-brand opacity" href="./projectManager.html"
            >Quản lý dự án</a
          >
          <div class="navbar-links">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link opacity" href="./projectManager.html"
                  >Dự án</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link opacity active" href="./myTask.html"
                  >Nhiệm vụ của tôi</a
                >
              </li>
              <li class="nav-item">
                <button class="nav-link opacity" id="logoutBtn">
                  Đăng xuất
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <section class="container">
      <div class="content-container">
        <div class="circle circle-one"></div>
        <div class="main-content">
          <h1 class="opacity">QUẢN LÝ NHIỆM VỤ</h1>
          <div class="d-flex">
            <button class="action-btn opacity" id="addTaskBtn">
              + Thêm Nhiệm Vụ
            </button>
            <div class="sort-filter">
              <select class="form-select opacity" id="sortTasks">
                <option value="" disabled selected>Sắp xếp theo</option>
                <option value="priority-desc">Độ ưu tiên: Cao đến Thấp</option>
                <option value="priority-asc">Độ ưu tiên: Thấp đến Cao</option>
                <option value="dueDate-asc">Hạn chót: Sớm nhất trước</option>
                <option value="dueDate-desc">Hạn chót: Muộn nhất trước</option>
              </select>
            </div>
            <input
              type="text"
              placeholder="Tìm kiếm nhiệm vụ"
              id="searchTasks"
              class="search-input"
            />
          </div>

          <h3 class="opacity">Danh Sách Nhiệm Vụ</h3>
          <div class="task-section">
            <table class="project-table">
              <tbody id="myTaskList"></tbody>
            </table>
          </div>

          <nav aria-label="Page navigation">
            <ul class="pagination" id="pagination"></ul>
          </nav>
        </div>
        <div class="circle circle-two"></div>
      </div>
      <div class="theme-btn-container"></div>
    </section>

    <footer>© 2025 Quản Lý Nhiệm Vụ. All rights reserved.</footer>

    <script src="../js/logout.js" type="module"></script>
    <script src="../js/myTask.js" type="module"></script>
    <script>
      function saveStatus(taskId, newStatus) {
        const statusErrors = validateInput(newStatus, "status");
        if (statusErrors.length === 0) {
          const index = myTasks.findIndex((t) => t.id === taskId);
          if (index !== -1) {
            myTasks[index] = {
              ...myTasks[index],
              status: newStatus,
              progress: newStatus,
              isEditing: false,
            };
            const globalIndex = tasks.findIndex((t) => t.id === taskId);
            if (globalIndex !== -1) {
              tasks[globalIndex] = { ...myTasks[index] };
              localStorage.setItem("tasks", JSON.stringify(tasks));
            }
          }
          renderMyTask(document.getElementById("searchTasks").value);
        }
      }
    </script>
  </body>
</html>
