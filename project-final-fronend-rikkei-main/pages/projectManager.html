<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Dự Án</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/projectManager.css" />
    <link rel="stylesheet" href="../css/validate.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="container-fluid">
          <a class="navbar-brand opacity" href="./projectManager.html"
            >Quản lý dự án</a
          >
          <div class="navbar-links">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link opacity" href="./projectManager.html"
                  >Dự án</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link opacity" href="./myTask.html"
                  >Nhiệm vụ của tôi</a
                >
              </li>
              <li class="nav-item">
                <button class="nav-link opacity" id="logoutBtn">
                  Đăng xuất
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <section class="container">
      <div class="content-container">
        <div class="circle circle-one"></div>
        <div class="main-content">
          <h1 class="opacity">QUẢN LÝ DỰ ÁN NHÓM</h1>
          <div class="d-flex">
            <button class="action-btn opacity" id="addProjectBtn">
              + Thêm Dự Án
            </button>
            <input
              type="text"
              placeholder="Tìm kiếm dự án"
              id="findProject"
              class="search-input"
            />
          </div>

          <h3 class="opacity">Danh Sách Dự Án</h3>
          <table class="project-table">
            <thead>
              <tr>
                <th scope="col" class="text-center">ID</th>
                <th scope="col">Tên Dự Án</th>
                <th scope="col">Mô Tả</th>
                <th scope="col" class="text-center">Hành Động</th>
              </tr>
            </thead>
            <tbody id="projectTableBody"></tbody>
          </table>

          <nav aria-label="Page navigation">
            <ul class="pagination" id="pagination"></ul>
          </nav>
        </div>
        <div class="circle circle-two"></div>
      </div>
      <div class="theme-btn-container"></div>
    </section>

    <footer>© 2025 Quản Lý Dự Án Nhóm. All rights reserved.</footer>

    <script src="../js/projectManager.js" type="module"></script>
    <script src="../js/logout.js" type="module"></script>
    <script src="../js/taskListProject2.js" type="module"></script>
  </body>
</html>
